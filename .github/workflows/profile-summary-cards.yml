name: Profile summary cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/profile-summary-cards.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
      # Commit through the REST API so GitHub signs the commit (Verified)
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = process.env.GITHUB_REF_NAME;
            const files = ['3-stats.svg', '2-most-commit-language.svg']
              .map((f) => `profile-summary-card-output/transparent/${f}`);

            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const { data: parent } = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.object.sha });
            const tree = await Promise.all(files.map(async (path) => {
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content: fs.readFileSync(path, 'utf8'), encoding: 'utf-8',
              });
              return { path, mode: '100644', type: 'blob', sha: blob.sha };
            }));
            const { data: newTree } = await github.rest.git.createTree({ owner, repo, base_tree: parent.tree.sha, tree });
            if (newTree.sha === parent.tree.sha) {
              core.info('Cards unchanged, nothing to commit');
              return;
            }
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, message: 'Update profile summary cards', tree: newTree.sha, parents: [parent.sha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.sha });
